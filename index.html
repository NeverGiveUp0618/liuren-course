<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>六壬神课</title>
<meta name="theme-color" content="#F3F0F9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon180.png">
<!-- ⚠️ 2026-08-25 加：防「一进来界面不对、等一下才好」。
     style.css 是外部文件，微信里网络一慢就迟迟不到，页面会先按浏览器默认排版画出来——
     所有 .screen 同时显示、内容占满整屏、中文回落宋体，就是用户截到的那个样子。
     这里内联**最少的几条**保证首屏不乱：屏幕切换、容器宽度、底色字体。
     ⚠️ 放在 <link> 之前、不用 !important，外部 CSS 一到就正常接管。
     ⚠️ 只写这三类，别往里堆——内联多了改一处要改两地方。 -->
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;background:#EEEDF1;color:#191C28;
    font:16px/1.85 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  @media (prefers-color-scheme:dark){body{background:#101219;color:#E2E5EE}}
  main{max-width:820px;margin:0 auto;padding:14px}
  .screen{display:none}
  .screen.active{display:block}
  .menu{display:flex;flex-direction:column;gap:8px;margin:16px 0}
  .mi{display:block;width:100%;text-align:left;padding:14px 16px;border:0;background:none;
    color:inherit;font:inherit;cursor:pointer}
  .mi b{display:block}
  .stats{display:flex;gap:10px;margin:18px 0 6px}
  .stats div{flex:1;text-align:center}
  .stats b{display:block}
</style>
<!--ASSET-CSS--><link rel="stylesheet" href="b/0add90f48d/style.css"><!--/ASSET-CSS-->
</head>
<body>
<header class="top">
  <button class="back" id="btnBack" aria-label="返回">‹ 返回</button>
  <h1 id="ttl">六壬神课</h1>
  <div class="acts">
    <button class="act" id="btnSearch" aria-label="搜索">索</button>
    <button class="act theme-tog" id="btnTheme" aria-label="配色">朱雀红</button>
  </div>
</header>

<main id="main">
  <!-- 首页 -->
  <section class="screen active" id="s-home">
    <div class="hero">
      <!-- 式盘纹：方为地盘、圆为天盘，四正子午卯酉（2026-10-22 用户嫌首页「主题不突出」） -->
      <svg class="hero-pan" viewBox="0 0 120 120" aria-hidden="true">
        <rect x="14" y="14" width="92" height="92" rx="3"/>
        <circle cx="60" cy="60" r="40"/><circle cx="60" cy="60" r="22"/>
        <path d="M60 20v18M60 82v18M20 60h18M82 60h18"/>
        <text x="60" y="12">午</text><text x="60" y="117">子</text><text x="5" y="64">卯</text><text x="115" y="64">酉</text>
      </svg>
      <div class="hero-k">大六壬 · 三式之一</div>
      <div class="hero-t">六壬<em>神课</em></div>
      <p class="hero-s">按知识依赖顺序重排的自学教程 · 一课一课往下读</p>
      <div class="stats">
        <div><b id="hLesson">—</b><span>课已成</span></div>
        <div><b id="hPlan">—</b><span>课排定</span></div>
        <div><b id="hPan">—</b><span>张课盘</span></div>
      </div>
    </div>
    <div id="resume"></div>
    <!-- ⚠️ 首页是**目录**（一眼看全站有什么），底栏是**快捷**（常用四处随时跳）。
         课程／课例／速查三项两处都有，这是有意的：分组之后它读起来是「这一组里的一项」，
         不是把导航又摆一遍。⚠️ 别把这里改成四张大卡片＋底栏四栏——
         那就成了同一件事做两遍（六壬神课 2026-08-12 踩过，用户原话「太繁琐」）。
         ⚠️ 分组口径＝00 总目录里那句「依赖驱动 vs 查阅式」，改这里先回去看那句。 -->
    <div class="menu">
      <div class="mgrp g1"><i>学</i><s class="sep"> · </s><span>一课一课往下读</span></div>
      <button class="mi" data-go="course"><b>课程</b><span>从起课到断课，一课一课来</span></button>

      <div class="mgrp g2"><i>练</i><s class="sep"> · </s><span>自己动手</span></div>
      <button class="mi" data-go="lab"><b>起盘台</b><span>拨月将、占时、日干支 · 全盘四课三传＋格局毕法初判</span></button>
      <button class="mi" data-go="qlist"><b>课例</b><span><b id="mQuiz">—</b> 例实盘 · 自己先推，再看拆解</span></button>

      <div class="mgrp g3"><i>查</i><s class="sep"> · </s><span>断课时随用随翻</span></div>
      <button class="mi" data-go="ref"><b>速查</b><span><b id="mRef">—</b> 张表 · 学完之后天天翻的那些</span></button>
      <button class="mi" data-go="xflist"><b>象法速查</b><span><b id="mXf">—</b> 条断法规则 · 占什么事看什么字 · 含天时晴雨</span></button>
      <button class="mi" data-go="gelist"><b>格局</b><span><b id="mGe">—</b> 格详解 · 定完课体来这儿查断意</span></button>
      <button class="mi" data-go="bflist"><b>毕法赋</b><span><b id="mBifa">—</b> 法逐格详解 · 断课时按法号或格名查</span></button>
      <button class="mi" data-go="jinsuo"><b>金锁玉匙</b><span><b id="mJs">—</b> 首诗诀 · 只看初传加在哪个字上的简断</span></button>
      <button class="mi" data-go="extra" data-id="bayao"><b>课式八要素</b><span>排盘前的检查单 · 太岁月建日辰占时月将空亡本命行年</span></button>

      <div class="mgrp g4"><i>读</i><s class="sep"> · </s><span>不读也不影响起课</span></div>
      <button class="mi" data-go="xarch"><b>附篇</b><span>源流与背景 · 口诀合集 · 八煞九宝详解 · 旧版入门与速查</span></button>
    </div>
    <div class="card" id="progCard">
      <button class="proghd" id="progTog" aria-expanded="false">
        <span class="ar">›</span><b>学习进度</b><span class="muted" id="progPct">—</span>
      </button>
      <div class="bar"><i id="progBar" style="width:0"></i></div>
      <div class="row wrap" id="progChips"></div>
    </div>
    <p class="muted center" id="buildInfo"></p>
  </section>

  <!-- 课程列表 -->
  <section class="screen" id="s-course"><div id="courseList"></div></section>

  <!-- 课文 -->
  <section class="screen" id="s-lesson">
    <div id="lessonBody" class="doc"></div>
    <div class="pager">
      <button class="btn" id="prevL">‹ 上一课</button>
      <button class="btn" id="nextL">下一课 ›</button>
    </div>
  </section>

  <!-- 学习路线 -->
  <section class="screen" id="s-qlist">
    <div class="qbar"><div id="qFilters" class="chips"></div></div>
    <div id="qRows"></div>
  </section>

  <section class="screen" id="s-quiz"><div id="quizBody" class="doc"></div></section>

  <section class="screen" id="s-gelist"><div id="geRows"></div></section>
  <section class="screen" id="s-xarch"><div id="xarchList" class="menu"></div></section>
  <section class="screen" id="s-extra"><div id="extraBody" class="doc"></div></section>
  <section class="screen" id="s-xflist">
    <div class="sbox"><input id="xq" type="search" placeholder="搜象法，如：类神 空亡 白虎" autocomplete="off"></div>
    <div class="qbar"><div id="xfFilters" class="chips"></div></div>
    <div id="xfList"></div>
  </section>
  <section class="screen" id="s-bflist"><div id="bfRows"></div></section>
  <!-- 金锁玉匙：上排初传、下排所临地盘，两下出诗；下面全表可搜 -->
  <section class="screen" id="s-jinsuo">
    <p class="lead">初传天盘字<b>加</b>在地盘哪个字上，查一首诗——《通解》下册外编的<b>发用简断</b>。⚠️ 再看初传乘的天将定吉凶。</p>
    <div id="jsPick"></div>
    <div id="jsHit"></div>
    <div class="sbox"><input id="jsq" type="search" placeholder="搜格名、相加或诗句，如：鹊噪 子加丑 升迁" autocomplete="off"></div>
    <div class="qbar"><div id="jsTabs" class="chips"></div></div>
    <div id="jsList"></div>
  </section>
  <section class="screen" id="s-bifa"><div id="bfBody" class="doc"></div></section>
  <section class="screen" id="s-ge"><div id="geBody" class="doc"></div></section>

  <section class="screen" id="s-outline"><div id="outlineBody" class="doc"></div></section>

  <!-- 起盘台 -->
  <section class="screen" id="s-lab">
    <p class="lead">拨月将、占时、日干支，天盘天将实时转，下面接着排出四课三传、课体与可判的格局（原「六壬神课」自选起课器并入）。</p>
    <div class="ctrl">
      <div class="fld"><label for="s-yj">月将</label><select id="s-yj"></select></div>
      <div class="fld"><label for="s-zs">占时</label><select id="s-zs"></select></div>
      <div class="fld"><label for="s-gan">日干</label><select id="s-gan"></select></div>
      <div class="fld"><label for="s-zhi">日支</label><select id="s-zhi"></select></div>
    </div>
    <div id="labPan"></div>
    <div class="readout" id="labRead"></div>
    <div id="labFull"></div>
    <blockquote class="warn">⚠️ 四课三传按《通解》发用取上神（第 5、6 课）；格局与毕法只列程序能判准的，详断仍查「格局」「毕法赋」。还没学到第 4–6 课的，先只看上面的天盘天将。</blockquote>
  </section>

  <!-- 搜索 -->
  <section class="screen" id="s-search">
    <div class="sbox"><input id="q" type="search" placeholder="搜全站：课文、附篇、格局、毕法、课例、象法" autocomplete="off"></div>
    <div id="sres"></div>
  </section>
  <!-- 速查 -->
  <section class="screen" id="s-ref">
    <div class="sbox"><input id="rq" type="search" placeholder="搜表名或表里的字，如：寄宫 驿马 涉害" autocomplete="off"></div>
    <div id="refList"></div>
  </section>
</main>

<!-- 底栏：色块＋字（与命理精讲、象义随身一致）。单字在圆角块里，选中时块填青金蓝、字转白。
     ⚠️ 加这条是因为：套壳在五术堂里时顶栏的 ‹返回 被藏了（那条返回是回导航首页，不是回本站），
        读到课文深处就没有任何回本站首页的路。底栏常驻，四个根屏随时可跳。 -->
<nav class="tabbar">
  <button data-tab="home" class="on"><b>首</b><span>首页</span></button>
  <button data-tab="course"><b>学</b><span>课程</span></button>
  <button data-tab="qlist"><b>例</b><span>课例</span></button>
  <button data-tab="ref"><b>查</b><span>速查</span></button>
</nav>

<!-- 课内目录（长课一万多字，没这个只能靠搜） -->
<button class="fab" id="fabToc" aria-label="本课目录">目</button>
<div class="tocmask" id="tocMask"><div class="tocbox"></div></div>

<script src="b/0add90f48d/data/data-meta.js"></script>
<script src="b/0add90f48d/engine.js"></script>
<script src="b/0add90f48d/app.js"></script><!--/ASSET-JS-->
</body>
</html>
